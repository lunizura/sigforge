[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigforge"
version = "0.1.0"
description = "Compiler-resilient x86-64 AOB signature synthesizer, patch-survival simulator, and C++20 scanner compiler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[project.scripts]
sigforge = "sigforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
